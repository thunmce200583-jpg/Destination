<head>
  <meta charset="UTF-8">

  <style>
    /* Nền trang trí màu xanh dương thanh lịch phong cách du lịch */
    body {
      margin: 2%;
      border: 3px solid #1565c0;
      background-color: #e3f2fd;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      border-radius: 12px;
      padding: 10px;
    }

    h1 {
      color: #0d47a1;
      margin-bottom: 10px;
    }

    /* Khung hiển thị ảnh địa điểm lớn ở giữa */
    #image {
      line-height: 500px;
      width: 500px;
      height: 500px;
      border: 5px solid #0d47a1;
      border-radius: 15px;
      margin: 10px auto 25px auto;
      text-align: center;
      background-color: #90caf9;
      background-repeat: no-repeat;
      color: #ffffff;
      font-size: 140%;
      font-weight: bold;
      background-size: cover;
      background-position: center;
      box-shadow: 0px 6px 12px rgba(0,0,0,0.2);
    }

    /* Định dạng 6 ảnh nhỏ bên dưới */
    img.preview {
      width: 14%;
      height: 120px;
      object-fit: cover;
      margin: 0.8%;
      border: 3px solid #1565c0;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    /* Hiệu ứng khi rê chuột hoặc nhấn phím Tab (Focus) vào ảnh */
    img.preview:hover, img.preview:focus {
      transform: scale(1.08);
      border-color: #0d47a1;
      outline: 3px solid #ffeb3b; /* Viền nổi bật hỗ trợ tiếp cận bàn phím */
    }
  </style>
</head>

  <script>
    /* Hàm chạy khi di chuột vào hoặc nhấn Tab chuyển tiêu điểm (Focus) */
    function upDate(previewPic) {
      console.log("Sự kiện kích hoạt cho:", previewPic.alt);
      let imageDiv = document.getElementById("image");
      
      // Đổi câu chữ hiển thị thành thuộc tính alt của ảnh
      imageDiv.innerHTML = previewPic.alt;
      
      // Đổi ảnh nền thành đường dẫn src của ảnh
      imageDiv.style.backgroundImage = "url('" + previewPic.src + "')";
    }

    /* Hàm chạy khi rê chuột ra ngoài hoặc rời tiêu điểm phím Tab (Blur) */
    function unDo() {
      let imageDiv = document.getElementById("image");
      
      // Xóa ảnh nền
      imageDiv.style.backgroundImage = "url('')";
      
      // Trả lại nội dung chữ mặc định
      imageDiv.innerHTML = "Hover over an image below to display here.";
    }

    /* Hàm tự động thêm tabindex="0" cho tất cả các hình ảnh bằng vòng lặp FOR khi tải trang */
    function addTabIndexes() {
      console.log("Trang web đã tải xong (onload triggered)");
      let images = document.querySelectorAll("img.preview");
      
      for (let i = 0; i < images.length; i++) {
        images[i].setAttribute("tabindex", "0");
        console.log("Đã thêm tabindex='0' cho ảnh thứ " + (i + 1));
      }
    }
  </script>
